seed: 42
project_name: jetssl_fixed_finetune
network_name: vertexer
ckpt_path: null
weight_ckpt_path: null
precision: medium
compile: null
tags: null
full_resume: false
ckpt_flag: last.ckpt
trainer:
  _target_: pytorch_lightning.Trainer
  min_epochs: 1
  max_epochs: null
  enable_progress_bar: true
  gradient_clip_val: 1
  precision: 16-mixed
  check_val_every_n_epoch: 1
  accelerator: auto
  devices: 1
  num_nodes: 1
  default_root_dir: ${paths.full_path}
  max_steps: 100000
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 1.0e-05
  scheduler:
    _target_: mltools.mltools.lightning_utils.linear_warmup_cosine_decay
    _partial_: true
    warmup_steps: 5000
    total_steps: null
  _target_: src.models.vertexer.Vertexer
  backbone_path: /srv/beegfs/scratch/groups/rodem/jetssl/jetssl3/backbones/kmeans.pkl
  vertex_config:
    num_blocks: 3
    hddn_dim: 128
    dropout: 0.2
    norm: LayerNorm
  loss_fn:
    _target_: mltools.mltools.loss.FocalLoss
    _partial_: true
    pos_weight: 0.778
    gamma: 3.0
datamodule:
  train_set:
    _target_: src.datamodules.hdf.JetMappable
    _partial_: true
    path: ${paths.data_dir}/btag
    n_classes: 3
    n_files: 1
    features:
    - - csts
      - f
      - - null
    - - mask
      - bool
      - null
    - - csts_id
      - l
      - null
    - - labels
      - l
      - null
    - - vtx_id
      - l
      - null
    - - vtx_pos
      - l
      - null
    - - track_type
      - l
      - null
    - - jets
      - f
      - null
    processes: train
  val_set:
    _target_: src.datamodules.hdf.JetMappable
    _partial_: true
    path: ${paths.data_dir}/btag
    n_classes: 3
    n_files: 1
    features:
    - - csts
      - f
      - - null
    - - mask
      - bool
      - null
    - - csts_id
      - l
      - null
    - - labels
      - l
      - null
    - - vtx_id
      - l
      - null
    - - vtx_pos
      - l
      - null
    - - track_type
      - l
      - null
    - - jets
      - f
      - null
    processes: valid
  test_set:
    _target_: src.datamodules.hdf.JetMappable
    _partial_: true
    path: ${paths.data_dir}/btag
    n_classes: 3
    n_files: 1
    features:
    - - csts
      - f
      - - null
    - - mask
      - bool
      - null
    - - csts_id
      - l
      - null
    - - labels
      - l
      - null
    - - vtx_id
      - l
      - null
    - - vtx_pos
      - l
      - null
    - - track_type
      - l
      - null
    - - jets
      - f
      - null
    processes: test
  _target_: src.datamodules.hdf.JetDataModule
  loader_config:
    batch_size: 500
    num_workers: 2
    drop_last: true
    shuffle: true
    collate_fn:
      _target_: src.datamodules.preprocessing.batch_preprocess
      _partial_: true
      fn:
        _target_: joblib.load
        filename: ${paths.root_dir}/resources/cst_quant.joblib
loggers:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    offline: false
    id: null
    log_model: false
    tags: ${tags}
    project: ${project_name}
    name: ${network_name}
    save_dir: ${paths.full_path}
    resume: ${full_resume}
paths:
  data_dir: /eos/home-s/ssaha/JetSSL_Unige/inputs_h5/
  output_dir: /eos/home-s/ssaha/JetSSL_Unige/jetssl/test_1/
  root_dir: ${oc.env:PROJECT_ROOT}
  full_path: ${paths.output_dir}/${project_name}/${network_name}/
callbacks:
  backbone_finetune:
    _target_: src.models.finetuning.CatchupToLR
    unfreeze_at_step: 5000
    catchup_steps: 5000
  best_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${paths.full_path}/checkpoints
    filename: best
    monitor: valid/total_loss
    mode: min
    save_weights_only: true
    auto_insert_metric_name: false
    enable_version_counter: false
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: valid/total_loss
    patience: 25
    mode: min
  model_summary:
    _target_: pytorch_lightning.callbacks.RichModelSummary
    max_depth: 2
  lr_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
n_jets: 23102664
